name: Test on dev

on:
  pull_request:
    branches: [ dev ]

jobs:
  build-test-dev:
    if: ${{ !github.event.repository.is_template && github.repository != 'Baekmalogistics/your-template-repo-name' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests with test profile
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test
